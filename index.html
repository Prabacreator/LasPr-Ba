<!doctype html>
<html lang="en">
<head>
  
  <!-- Required meta tags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>l@s</title>
  
  <!-- STYLE CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
  
  <style>
    :root{--radius: 1rem;}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    font-weight:500;
    background: #ccc;
  }
  .container{
    width:100%;
    min-height:100vh;
    display:flex;
    flex-direction:column; 
    text-shadow: 0 1px 2px #000;
  }
  @media(min-width: 768px){
    .container{
      max-width: 420px;
    }
  }
  .small{font-size:.8rem !important;}
  .tiny{font-size:.65rem !important;}
  .hidden{display: none;}
  .pointer{cursor: pointer;}
  label{
    font-size: .9rem;
    font-weight: 350;
    margin: 0 .5rem;
    text-transform: capitalize;
  }
  .form-select,
  .form-control{
    min-height: calc(1.5em + .5rem + 2px);
    padding: .25rem .5rem;
    font-size: .875rem;
    border-radius: .25rem;
    border: 1px solid #000;
  }
  .bg-0{
    background: transparent;
    border: none;
  }
  input[type=text]{
    text-transform: capitalize;
  }
  input[type=number]{
    text-align: center;
  }
  .btn {
    padding: .25rem .5rem;
    font-size: .875rem;
    border-radius: .25rem;
    text-transform: capitalize;
    text-shadow: 0 1px 2px #000;
  }
  hr{
    border:none;
    height:4px;
    background:linear-gradient(
      to right,
      transparent,
      #000,
      transparent
    );
  }
  .table-responsive{
    background-image: url('../dist/img/bg-nota.png)');
    padding:.5rem;
  }
  table{
    width:100%;
    border-collapse:collapse;
    font-size:.75rem;
    font-family:var(--bs-font-monospace);
    text-align: center;
    vertical-align: middle;
  }
  table th,
  table td{
    padding:.15rem .25rem;
    white-space: nowrap;
  }
  thead th{
    color: #000;
    border-top: .5px solid#0d6efd;
    border-bottom: 1px solid#0d6efd;
  }
  tbody tr{
    cursor:pointer;
    transition:.2s;
    vertical-align: middle;
    text-transform:capitalize;
    border-bottom: 1px solid#0d6efd;
  }
  tbody td:nth-child(2){
    cursor: pointer;
    text-align: left;
  }
  tbody td:nth-child(3){
    color: #dc3545;
    text-align: center;
  }
  tbody td:nth-child(4){
    text-align: right;
  }
  tbody td:nth-child(5){
    color: #0d6efd;
    font-weight: 700;
    text-align: right;
  }
  tbody tr:hover{
    background:#ccc;
    font-weight: bold;
  }
  .swal2-popup{
    padding: 1.5rem ;
    border-radius: 1rem; 
  }
  .swal2-title{
    color: #212529;
    font-weight: 330;
    font-size: 1.25rem; 
  }
  .swal2-confirm{ 
    color: #f8f9fa; 
    background: #198754;
    border-radius: 25px;  
    padding: .5rem 1.25rem;  
  }
  .swal2-cancel{ 
    color: #212529; 
    background: #a3cfbb; 
    border-radius: 25px; 
    padding: .5rem 1.25rem; 
  }
  .swal2-icon{
    margin-top: .5rem;
    background: transparent;
  }
  .img-preview{
    width:100%;
    padding: 1rem .25rem;
    margin-bottom:1rem;
    border-radius: .25rem;
  }
  .flex-input{
    gap: 1rem;
    display: flex;
    justify-content:space-between;
    margin-bottom: 1rem;
  }
  .flex-input input{
    width: 50%;
  }
  .title{
    color: #000;
    font-size: 1.2rem;
    font-weight: bold;
    text-align: center;
  }
  </style>
</head>
<body>
<div class="container">
  <header id="canvas" class="mb-auto py-2">
    <h5 class="title">Data Las Borongan<br> Produksi Rangka Beton</h5>
    <hr>
    <ul id="myList" class="list-input-group my-2">
    </ul>
    <div id="myTable" class="table-responsive">
    </div>
  </header>
  
  <footer class="mt-auto mb-5">
    <div class="d-flex justify-content-center my-2">
      <button type="button" class="btn btn-outline-success mx-2" onclick="saveImg()"><i class="bi bi-printer me-2"></i>Print</button>
      <button type="button" class="btn btn-outline-success mx-2" onclick="loadImg()"><i class="bi bi-journal me-2"></i>Nota</button>
      <button type="button" class="btn btn-outline-success mx-2" onclick="myForm('on')"><i class="bi bi-pencil-square me-2"></i>Input</button>
    </div>
  </footer>
</div>

<div id="myForm" class="modal fade" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <form id="add" class="modal-content">
      <div class="modal-header">
        <input type="text" id="dte" class="form-control text-primary fw-bolder fs-5 border-0 me-5">
        <button type="button" class="btn-close"  onclick="myForm()"></button>
      </div>
      <div class="modal-body">
        <div class="flex-input">
          <label for="weeks">Minggu</label>
          <input type="text" id="weeks" class="form-control" required>
        </div>
        <div class="flex-input">
          <label for="qty">Jml</label>
          <input type="number" id="qty" class="form-control" required>
        </div>
        <div class="flex-input">
          <label for="prc">Jasa</label>
          <input type="number" id="prc" class="form-control" list="price" required>
          <datalist id="price"></datalist>
        </div>
        <div class="flex-input">
          <label for="sum">Total</label>
          <input type="number" id="sum" class="form-control" readonly disabled>
        </div>
      </div>
      <div class="modal-footer">
        <button id="del" type="button" class="btn btn-danger hidden">Hapus</button>
        <button type="submit" form="add" class="btn btn-success" >Simpan</button>
      </div>
    </form>
  </div>
</div>

<div id="myImg" class="modal fade" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="background:transparent">
      <div class="modal-body">
        <div id="loadImg">
          
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
// UTILITAS
const $ = e =>
  document.querySelector(
    /^[.#\[\s>:]/.test(e) ? e : `.${e}`
  );

const $$ = e => document.querySelectorAll(e);

const val = (e, v) =>
  v === undefined
    ? $(e)?.value
    : ($(e).value = v ?? '');

const html = (e, v) =>
  v === undefined
    ? $(e)?.innerHTML
    : ($(e).innerHTML = v ?? '');

const text = (e, v) =>
  v === undefined
    ? $(e)?.textContent
    : ($(e).textContent = v ?? '');

const show = e => ({
  add: () => $(e)?.classList.add('hidden'),
  remove: () => $(e)?.classList.remove('hidden'),
  toggle: () => $(e)?.classList.toggle('hidden')
});

const Tx = (str = '') =>
  String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

const Nm = n => Number(n) || 0;

const Rp = n =>
  Nm(n).toLocaleString('id-ID');

const times = () =>
  new Date().toLocaleString('id-ID', {
    weekday: 'long',
    day: 'numeric',
    month: 'short',
    year: 'numeric'
  });


// SWEETALERT
const ok = msg =>
  Swal.fire({
    icon: 'success',
    title: msg,
    timer: 2000,
    showConfirmButton: false
  });

const er = msg =>
  Swal.fire({
    icon: 'warning',
    title: msg,
    timer: 2200,
    showConfirmButton: false
  });

const confirmDel = msg =>
  Swal.fire({
    icon: 'question',
    title: msg || 'Yakin mau dihapus ?',
    showCancelButton: true,
    confirmButtonText: 'Ya',
    cancelButtonText: 'Batal'
  });


// INDEXED DB
let db;
let data = [];
let week = '';
let edit = null;

const openDB = () =>
new Promise((resolve, reject) => {
  const rq = indexedDB.open('L@sDB', 2);

  rq.onupgradeneeded = e => {
    db = e.target.result;
    ['las', 'img'].forEach(store => {
      if (!db.objectStoreNames.contains(store)) {
        db.createObjectStore(store,{keyPath: 'id', autoIncrement: true});
      }
    });
  };

  rq.onsuccess = e => {
    db = e.target.result;
    resolve(db);
  };

  rq.onerror = () => reject(rq.error);
});


const api = (act, store, d) =>
new Promise((resolve, reject) => {
  if (!db) {
    reject(new Error('Database belum siap'));
    return;
  }

  const s = db.transaction(store,act === 'all' ? 'readonly' : 'readwrite').objectStore(store);

  let r;
  switch (act) {
    case 'add': r = s.add(d);
      break;
    case 'set': r = s.put(d);
      break;
    case 'del': r = s.delete(d);
      break;
    case 'all': r = s.getAll();
      break;
    case 'get': r = s.get(d);
      break;
    default: reject(new Error('Invalid action'));
      return;
  }

  r.onsuccess = () => resolve(r.result);
  r.onerror = () => reject(r.error);
});


// MODAL
const modal =id=> bootstrap.Modal.getOrCreateInstance($(id));

const myReset = () => {
  $('#myForm')
    .querySelectorAll('input')
    .forEach(e => e.value = '');
  val('#dte', times());
  show('#del').add();
  edit = null;
};

const myForm = on => {
  if (!on) {
    myReset();
    modal('#myForm').hide();
    myReset();
    return;
  }

  val('#dte', times());
  val('#weeks', week);
  modal('#myForm').show();
};


// LOAD DATA
async function loadData() {
  try {
    data = await api('all', 'las') || [];

    const weeks = [ ...new Set(data.map(e => e.weeks).filter(Boolean))];

    week = weeks.at(-1) || '';

    html('#myList',weeks.length
    ? weeks.map(w => {
      const item = data.find(e => e.weeks === w );

      return `<li class="list-input fw-light pointer" onclick="selectData(${Nm(item?.id)})"> ${Tx(w)}</li>`}).join('')

    : `<li class="list-input">Belum ada Data</li>`);
    
    if (week) {
      const last = data.find(e => e.weeks === week);

      if (last) {
        selectData(last.id);
      }
    }

  } catch (e) {
    console.log(e);
    er(
      e.message || 'Error'
    );
  }
}

// SELECT DATA
function selectData(id) {
  try {
    const record = data.find(e => Nm(e.id) === Nm(id));
    
    if (!record) {
      er('Data tidak ditemukan');
      return;
    }
    
    show('#myList').add();
  
    const w = week = Tx(record.weeks);
    const m = record.makes || [];
    
    html('#myTable',`
    <div class="d-flex justify-content-between">
      <h5 class="fw-light">
        ${w}
      </h5>
      <h5 class="back pointer">
        &#9776;
      </h5>
    </div>
    <table class="my-3">
      <thead>
        <tr>
          <th rowspan="2" colspan="2">
            Hari & Tanggal
          </th>
          <th rowspan="2">
            Jml
          </th>
          <th colspan="2">
            U P A H
          </th>
        </tr>
        <tr id="thead">
          <th>Satu</th>
          <th>Total</th>
        </tr>
      </thead>
      <tbody>
      ${m.length
      ? m.map(x => {
        const row = Nm(x.row);
        const dte = Tx(x.dte);
        const qty = Nm(x.qty);
        const prc = Nm(x.prc);
        const sum = Nm(x.sum);
        return `
        <tr>
          <th>${row}</th>
          <td onclick="updateData(${Nm(record.id)},${row})">${dte}</td>
          <td>${qty}</td>
          <td>${Rp(prc)}</td>
          <td>${Rp(sum)}</td>
        </tr>`
        }).join('')
      : `<tr>
          <td colspan="5" class="text-center py-3">Belum ada Data</td>
        </tr>`}
      </tbody>
      <tfoot>
        <tr class="text-start">
          <th colspan="2" class="pt-3">
            Jml Produksi</th>
          <th class="pt-3">:</th>
          <th colspan="2" class="text-end text-danger pt-3">${Nm(m.reduce((a, b) => a + Nm(b.qty), 0))} unit</th>
        </tr>
        <tr class="text-start">
          <th colspan="2">
            Total Upah</th>
          <th>:</th>
          <th colspan="2" class="text-end text-primary">Rp ${Rp(m.reduce((a, b) => a + Nm(b.sum), 0))}</th>
        </tr>
      </tfoot>
    </table>`);
    
    const price = [...new Set(
      m.map(x => x.prc).filter(Boolean)
    )];
    
    html('#price', `<option>${Nm(price)}</option>`);
    
    $$('.back').forEach(e=> {
      e.onclick =()=> {
        week = [ ...new Set(data.map(e => e.weeks).filter(Boolean))].at(-1);
        html('#myTable','');
        show('#myList').remove();
      }
    });

  } catch (e) {
    console.log(e);
    er(
      e.message || 'Error'
    );
  }
}


// INPUT / EDIT DATA
async function inputData(e) {
  e.preventDefault();
  try {
    const weeks = val('#weeks')?.trim();

    if (!weeks) {
      er('Minggu wajib diisi');
      return;
    }

    const dte = Tx(val('#dte')) || times();
    const qty = Nm(val('#qty'));
    const prc = Nm(val('#prc'));
    const sum = qty * prc;


    // EDIT
    if (edit) {
      const record = edit.data;

      const index = (record.makes || []).findIndex(x =>Nm(x.row) === Nm(edit.row));

      if (index < 0) {
        er('Data tidak ditemukan'
        );
        return;
      }

      record.makes[index] = {
        row: Nm(edit.row),
        dte, qty, prc, sum
      };

      record.weeks = weeks;


      await api('set', 'las', record);
      week = weeks;
      edit = null;
      await loadData();
      myForm();
      
      const selected = data.find(x => x.weeks === weeks);

      if (selected) {
        selectData(selected.id);
      }

      ok('Data berhasil diperbarui');

      return;
    }


    // DATA BARU
    const record = data.find(x => x.weeks === weeks);

    // Minggu sudah ada
    if (record) {
      const makes = record.makes || [];

      const row = 
      makes.length
        ? Math.max( ...makes.map(x => Nm(x.row))) + 1
        : 1;

      makes.push({row, dte, qty, prc, sum});

      record.makes = makes;

      await api('set', 'las', record);

    }

    // Minggu baru
    else {
      await api( 'add', 'las',
        {weeks,makes: [{row: 1, dte, qty, prc, sum}]});
    }


    week = weeks;
    await loadData();
    myForm();


    const selected = data.find(x => x.weeks === weeks);

    if (selected) {
      selectData(selected.id);
    }

    ok('Data berhasil disimpan');

  } catch (e) {
    console.log(e);
    er(
      e.message || 'Error'
    );
  }
}


// UPDATE DATA
function updateData(id, row) {
  const record = data.find(e => Nm(e.id) === Nm(id));

  if (!record) {
    er('Data tidak ditemukan');
    return;
  }


  const item = (record.makes || []).find(x => Nm(x.row) === Nm(row));

  if (!item) {
    er('Data tidak ditemukan');
    return;
  }

  edit = {id, row, data: record};

  val('#dte', item.dte);
  val('#weeks', record.weeks);
  val('#qty', item.qty);
  val('#prc', item.prc);
  val('#sum', item.sum);

  show('#del').remove();
  modal('#myForm').show();
}


// DELETE DATA
async function removeData() {
  if (!edit) {
    return;
  }

  try {
    const result = await confirmDel();

    if (!result.isConfirmed) {
      return;
    }

    const record = edit.data;

    record.makes = (record.makes || []).filter(x => Nm(x.row) !== Nm(edit.row));


    // HAPUS RECORD MINGGU
    if (!record.makes.length) {
      await api('del', 'las', record.id);

      edit = null;
      await loadData();

      html('#myTable','');
      myForm();

      ok('Data berhasil dihapus');

      return;
    }


    // UPDATE RECORD
    await api( 'set', 'las', record);

    const id = record.id;
    edit = null;
    await loadData();
    myForm();

    const selected = data.find(x => Nm(x.id) === Nm(id));

    if (selected) {
      selectData(selected.id);
    }

    ok('Data berhasil dihapus');

  } catch (e) {
    console.log(e);
    er(
      e.message || 'Error'
    );
  }
}

async function loadImg(){
  try{
    const res = await api('all','img') || [];
    
    modal('#myImg').show();
    
    html('#loadImg',res.length
    ? res.map(x=>`
      <img src="${Tx(x.img)}" class="img-preview" alt="Nota">
      <div class="text-center my-2">
        <span class="badge bg-danger" data-row="${x.id}">Hapus</span>
      </div>`).join('')
    : `<div class="alert alert-info text-center"> Belum ada nota </div>`);
    
    $$('#loadImg span[data-row]').forEach(e=>
      e.onclick =async()=> {
        const ask = await confirmDel();
        if(!ask.isConfirmed) return;
        const del = res.find(x=> x.id===Nm(e.dataset.row));
        await api('del','img',del.id);
        await loadImg();
        ok('Deleted');
      }
    );

  }catch(e){
    er(e.message || 'Gagal memuat nota');
  }
}


async function saveImg(){
  try{
    Swal.fire({
      title:'Loading...',
      didOpen:()=> Swal.showLoading(),
      showConfirmButton:false,
      allowOutsideClick:false
    });
    
    show('.back').toggle();
    
    const canvas = await html2canvas($('#canvas'),{
      scale:2,
      useCORS:true
    });

    const img = canvas.toDataURL('image/png');

    await api('add','img',{
      img:img,
      date:new Date()
    });

    await loadImg();
    Swal.close();
    show('.back').toggle();
    ok('Nota berhasil dibuat');
    modal('#myImg').show();

  }catch(e){
    Swal.close();
    er(e.message || 'Gagal membuat nota');
  }
};

// INIT
document.addEventListener(
'DOMContentLoaded',async () => {
  try {
    await openDB();
    await loadData();
      
    // SUBMIT FORM
    $('#add').addEventListener('submit', inputData);
    
    // DELETE BUTTON
    $('#del').addEventListener('click', removeData);

    // INPUT TEXT
    $$('input[type=text]')
    .forEach(e => {
      e.oninput = () => {
        e.value =
           e.value.replace(
            /\b\w/g,
            c =>
              c.toUpperCase()
          );
      };
    });

    // HITUNG TOTAL
    $$('#qty, #prc')
    .forEach(e => {
      e.oninput = () => {
        const qty = Nm(val('#qty'));
        const prc = Nm(val('#prc'));
        val('#sum', qty * prc);
      };
    });

    // MODAL CLICK OUTSIDE
    $$('.modal')
    .forEach(m => {
      m.addEventListener('click',e => {
        if (e.target === m) { myForm() }
      });
    });


  } catch (e) {
    console.log(e);
    er(
      e.message || 'Error'
    );
  }
});
</script>
</body>
</html>
